    <!-- Вкладка: Оплата -->
    <div id="payment" class="tab-content">
        <h2>Оформление заказа</h2>
        <div class="payment-box">
            <p id="selected-product-text" style="font-size: 1.1rem; margin-bottom: 20px;">Выбран товар: <b>Ничего не выбрано</b></p>
            
            <!-- Блок с реквизитами (укажите свои данные) -->
            <div style="background: rgba(139, 92, 246, 0.1); border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                <p style="font-size: 0.950rem; color: var(--text-muted); margin-bottom: 8px;">💳 Реквизиты для перевода:</p>
                <p style="font-size: 1.1rem; font-weight: 700; color: var(--accent-cyan); user-select: all; margin-bottom: 5px;">0000 0000 0000 0000</p>
                <p style="font-size: 0.85rem; color: var(--text-muted);">Переведите точную сумму товара на карту (Сбер / Т-Банк) и нажмите кнопку ниже.</p>
            </div>

            <p style="color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; font-size: 0.9rem;">
                После перевода средств нажмите кнопку ниже, чтобы администратор проверил платеж.
            </p>
            <button class="btn-primary" onclick="simulatePayment()" style="margin-bottom: 15px;">Я оплатил(а)</button>
            <button class="btn-primary" onclick="checkStatus()" style="background: rgba(255,255,255,0.1); border: 1px solid var(--border-color);">Проверить статус</button>
            
            <div id="status-message"></div>
        </div>
    </div>
