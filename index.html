1rem; margin-bottom: 15px;">Вы вошли как: <b id="current-username" style="color: var(--accent-cyan);"></b></p>
        <button class="btn-primary" onclick="userLogout()" style="background: var(--danger);">Выйти из аккаунта</button>

        <h3 style="margin-bottom: 15px;">Выбор игровой валюты</h3>

</div>
